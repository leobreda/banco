<div class="container" style="max-width:360px;margin-top:80px;">
  <h2>Login</h2>

<h3>Bem-vindo ao Banco XYZ</h3>
<p>Por favor, insira suas credenciais para acessar sua conta.</p>


<table style="width:100%; margin-bottom:15px;">
  <tr>
    <td style="width:150px;">Agência</td>
    <td style="width:auto"><input type="number" size="4" [(ngModel)]="agencia" class="form-control" maxlength="4" oninput="this.value=this.value.slice(0,this.maxLength)" /></td>
  </tr>
  <tr>
    <td>Conta</td>
    <td><input type="number" size="5" [(ngModel)]="conta" class="form-control" maxlength="5" oninput="this.value=this.value.slice(0,this.maxLength)" /></td>
  </tr>
  <tr>
    <td>DAC</td>       
    <td><input type="number" size="2" [(ngModel)]="dac" class="form-control" maxlength="1" oninput="this.value=this.value.slice(0,this.maxLength)" /></td>
  </tr>
  <tr>
    <td>Senha</td>       
    <td><input type="password" size="10" [(ngModel)]="senha" class="form-control" maxlength="10" /></td>
  </tr>
</table>
<br />
  <button (click)="logar()" class="btn btn-green" style="margin-top:12px;">Entrar</button>

  <div *ngIf="error" style="color:red;margin-top:10px;">
    {{ error }}
  </div>
</div>
<hr />
